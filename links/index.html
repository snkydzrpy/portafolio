<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050408">
  <meta name="description" content="Links de @snkydzr.py">
  <meta property="og:title" content="@snkydzr.py">
  <meta property="og:description" content="Links">
  <meta property="og:type" content="website">
  <title>@snkydzr.py</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-pink" aria-hidden="true"></div>
  <div class="ambient ambient-purple" aria-hidden="true"></div>
  <div class="ambient ambient-blue" aria-hidden="true"></div>
  <div class="smoke-field" aria-hidden="true">
    <span class="smoke smoke-one"></span>
    <span class="smoke smoke-two"></span>
    <span class="smoke smoke-three"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <main class="page">
    <header class="masthead">
      <div class="tag" aria-label="BP.XO"><span>BP.</span><span class="tag-xo">XO</span></div>
      <div class="handle">@snkydzr.py</div>
      <div class="rule" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <nav class="links" aria-label="Links">
      <a class="link link-gh" href="https://github.com/snkydzrpy" target="_blank" rel="noopener noreferrer">
        <span class="index">01</span><span class="name">GitHub</span><span class="symbol" aria-hidden="true">↗</span>
      </a>
      <a class="link link-tt" href="https://www.tiktok.com/@snkydzr.py" target="_blank" rel="noopener noreferrer">
        <span class="index">02</span><span class="name">TikTok</span><span class="symbol" aria-hidden="true">↗</span>
      </a>
      <a class="link link-ig" href="https://www.instagram.com/snkydzr.py/" target="_blank" rel="noopener noreferrer">
        <span class="index">03</span><span class="name">Instagram</span><span class="symbol" aria-hidden="true">↗</span>
      </a>
      <a class="link link-pin" href="https://co.pinterest.com/blkpxo/_profile/" target="_blank" rel="noopener noreferrer">
        <span class="index">04</span><span class="name">Pinterest</span><span class="symbol" aria-hidden="true">↗</span>
      </a>
      <a class="link link-sub" href="https://substack.com/@snkydzr" target="_blank" rel="noopener noreferrer">
        <span class="index">05</span><span class="name">Substack</span><span class="symbol" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
  <script>
    (() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const finePointer = window.matchMedia('(pointer: fine)').matches;
      if (reduced || !finePointer) return;
      let last = 0;
      const colors = ['#4d8cff', '#8d6bd1', '#dce8ff', '#a72e52'];
      document.addEventListener('pointermove', (event) => {
        const now = performance.now();
        if (now - last < 34) return;
        last = now;
        const spark = document.createElement('span');
        spark.className = 'cursor-spark';
        spark.textContent = Math.random() > .5 ? '✦' : '✧';
        spark.style.left = event.clientX + 'px';
        spark.style.top = event.clientY + 'px';
        spark.style.setProperty('--spark-color', colors[Math.floor(Math.random() * colors.length)]);
        document.body.appendChild(spark);
        spark.addEventListener('animationend', () => spark.remove(), { once: true });
      }, { passive: true });
    })();
  </script>
</body>
</html>
